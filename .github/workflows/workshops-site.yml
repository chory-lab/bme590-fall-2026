name: Workshops Site

# Builds the JupyterLite workshop site (the browser-runnable class) and
# publishes it as the bme590-fall-2026 GitHub Pages site. See
# jupyterlite/build.py and jupyterlite/README.md.

on:
  push:
    branches: [main]
    paths:
      - "workshops/**"
      - "data/**"
      - "plr_workshops/**"
      - "jupyterlite/**"
      - "pyproject.toml"
      - ".github/workflows/workshops-site.yml"
  pull_request:
    paths:
      - "workshops/**"
      - "plr_workshops/**"
      - "jupyterlite/**"
      - ".github/workflows/workshops-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the build environment
        # pylabrobot (deck.html), the JupyterLite CLI + toolchain, and Pillow
        # (navbar logo shrink) all run host-side; numpy/pandas/pillow for the
        # *kernel* ship inside Pyodide's own lockfile. The vendored visualizer
        # assets (konva + shrunk logo) are committed, so no network fetch.
        run: |
          pip install --upgrade pip
          pip install \
            "pylabrobot==0.2.2" \
            pillow \
            "jupyterlite==0.8.1" \
            "jupyterlite-pyodide-kernel" \
            jupyter-iframe-commands \
            jupyterlab-widgets ipywidgets \
            jupyter-server

      - name: Build the JupyterLite site
        run: python jupyterlite/build.py --deploy deploy
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Sanity-check the deploy root
        # Only assets WE own. The JupyterLite output/ internals (extensions,
        # static) are upstream's business; "anywidget is available" is asserted
        # in the browser integration test (drive.cjs), not by peeking at paths.
        # -s (not -f) so a zero-byte artifact fails the build.
        run: |
          test -s deploy/index.html
          test -s deploy/bridge.js
          test -s deploy/deck.html
          test -s deploy/output/lab/index.html
          test -s deploy/output/files/00_plr_introduction.ipynb

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
