name: Workshops Site

# Builds the JupyterLite workshop site (the browser-runnable class) and
# publishes it as the bme590-fall-2026 GitHub Pages site. See
# jupyterlite/build.py and jupyterlite/README.md.

on:
  push:
    branches: [main]
    paths:
      - "workshops/**"
      - "data/**"
      - "plr_workshops/**"
      - "jupyterlite/**"
      - "pyproject.toml"
      # The viz3d demo's page (viz3d.html) ships its notebook, bridge and pinned PyLabRobot.
      - "demos/viz3d/demo.ipynb"
      - "demos/viz3d/uv.lock"
      - "demos/viz3d/src/**"
      - ".github/workflows/workshops-site.yml"
  pull_request:
    paths:
      - "workshops/**"
      - "plr_workshops/**"
      - "jupyterlite/**"
      - "demos/viz3d/demo.ipynb"
      - "demos/viz3d/uv.lock"
      - "demos/viz3d/src/**"
      - ".github/workflows/workshops-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the build environment
        # pylabrobot (deck.html) and Pillow (navbar logo shrink) run host-side;
        # numpy/pandas/pillow for the *kernel* ship inside Pyodide's own
        # lockfile. The vendored visualizer assets (konva + shrunk logo) are
        # committed, so no network fetch.
        #
        # The JupyterLite toolchain comes from requirements-build.txt, which is
        # the same file the local README tells you to install. This list used to
        # be maintained separately here and had drifted in two ways that both
        # shipped to students:
        #
        #   * `anywidget` was missing entirely, so the built site had no
        #     anywidget labextension -- and the bridge widget is an anywidget.
        #     It could not render, so it never posted __plrBridgeUp, so the
        #     parent never flushed its queue and the deck stayed blank. The
        #     kernel and the deck were both fine; only the wire between them
        #     was absent.
        #   * `jupyterlite-pyodide-kernel` was unpinned and resolved to 0.8.3,
        #     which is built against JupyterLab 4.6.1 while jupyterlite 0.8.1
        #     ships 4.6.0 -- a federation-runtime warning on every boot.
        run: |
          pip install --upgrade pip
          pip install "pylabrobot==0.2.2" pillow
          pip install -r jupyterlite/requirements-build.txt

      - name: Build the JupyterLite site
        run: python jupyterlite/build.py --deploy deploy
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Sanity-check the deploy root
        # -s (not -f) so a zero-byte artifact fails the build.
        run: |
          test -s deploy/index.html
          test -s deploy/bridge.js
          test -s deploy/deck.html
          test -s deploy/output/lab/index.html
          test -s deploy/output/files/workshops/00_plr_introduction.ipynb
          test -s deploy/output/files/data/fragments.csv
          test -s deploy/output/files/figs/fig_1_plr.jpg
          test -s deploy/viz3d.html
          test -s deploy/viz3d/viewer/index.html
          test -s deploy/viz3d/viewer/viz3d_shim.js
          test -s deploy/output/files/viz3d/demo.ipynb
          grep -q viz3d_shim.js deploy/viz3d/viewer/index.html
          test "$(find deploy/viz3d/viewer/models -name '*.glb' | wc -l)" -gt 0

      - name: Browser integration test
        # The check that would have caught the missing anywidget labextension,
        # and the one the comment above used to claim was already running.
        # drive.cjs boots the built site in a headless Chrome, runs every cell
        # of a notebook, and asserts against the notebook model that the cells
        # executed, that the visualizer mounted, that its events crossed into
        # the parent page, and that the deck actually drew them. A failing gate
        # exits non-zero.
        #
        # --probe sets exposeAppInBrowser, which the driver needs to read the
        # model. The artifact published below is built without it.
        run: |
          npm install ws
          python jupyterlite/build.py --probe --deploy deploy-test
          python -m http.server 8812 --directory deploy-test &
          sleep 3
          PLR_URL=http://127.0.0.1:8812/ PLR_NB=deck.ipynb node jupyterlite/drive.cjs
          PLR_URL=http://127.0.0.1:8812/ PLR_NB=workshops/00_plr_introduction.ipynb \
            node jupyterlite/drive.cjs
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: viz3d page integration test
        # The viz3d demo on its own page (viz3d.html), in headless Chromium: the bootstrap installs
        # the PRs' PyLabRobot rather than the workshops' 0.2.2, every cell runs in the browser
        # kernel, every motion is played and answered over the BroadcastChannel bridge mid-cell,
        # and the refusals are drawn. Its own server, so it does not lean on the step above's.
        run: |
          pip install "playwright>=1.44" pillow
          python -m playwright install --with-deps chromium
          python -m http.server 8813 --directory deploy-test &
          sleep 3
          python jupyterlite/viz3d/drive_viz3d.py --url http://127.0.0.1:8813/ --out viz3d-run

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viz3d-site-run
          path: viz3d-run/
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
