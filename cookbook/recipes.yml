# Recipe registry — the source of the task-indexed listing on recipes.qmd.
#
# One entry per recipe. `path` deep-links to the recipe's anchor inside its
# chapter, so recipes stay in narrative context while remaining individually
# addressable. Adding a recipe means adding an entry here; the chapter itself
# carries the content.
#
# Fields:
#   title   - the task, phrased as the reader would search for it
#   path    - chapter file + '#' + the recipe's {#anchor}
#   chapter - integer, for sorting
#   apis    - the PLR names the recipe uses, for keyword search

