[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bme590-workshops"
version = "0.1.0"
description = "Browser-runnable tooling for the BME 590 PyLabRobot workshops"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  # The canonical install target is the JupyterLite browser kernel. This is the
  # whole dependency set it needs: anywidget for the deck bridge, pylabrobot for
  # the library. numpy/pandas/pillow ship inside Pyodide's own lockfile in the
  # browser; jupyterlab/sidecar are desktop-only; pylabrobot's [visualizer,
  # opentrons] extras are hardware backends the browser never uses (the
  # visualizer module is in the base wheel).
  "anywidget>=0.9",
  "pylabrobot==0.2.2",
]

# The per-session entry point: `uv run bme590 start 01` and friends. Available
# because the installers install this project into .venv alongside its
# dependencies.
[project.scripts]
bme590 = "plr_workshops.cli:main"

# The student desktop install. `uv sync` installs the project plus this group,
# so one command produces the environment the workshops run in. Kept as a
# dependency-group, not an extra, so it never lands in the browser wheel.
#
# Why these: ipykernel is what VS Code needs to run .ipynb against .venv;
# ipywidgets backs the visualizer's widget rendering; pandas/numpy/pillow are
# imported by the notebooks themselves; nbformat is what scripts/doctor.py reads
# them with. `[opentrons]` adds the Opentrons labware definitions workshop 04
# uses. Everything here is a pure-Python or prebuilt wheel on all three
# platforms — no compiler, no git, no conda.
#
# jupyterlab is deliberately NOT here. It is the largest single download in the
# tree (it roughly doubles a cold install) and VS Code's Jupyter extension is
# the documented editor, so it lives in its own group for students who want a
# browser editor and for CI, which executes the notebooks.
[dependency-groups]
class = [
  "pylabrobot[opentrons]==0.2.2",
  "ipykernel>=6.29",
  "ipywidgets>=8.1",
  "nbformat>=5.10",
  "pandas>=2.2",
  "numpy>=1.26",
  "pillow>=10.3",
]
notebook = [
  "jupyterlab>=4.2",
  "nbclient>=0.10",
]

# Make `uv sync` (no flags) mean "the student environment". The installers rely
# on this: any extra flag a student has to type is a step that can go wrong.
[tool.uv]
default-groups = ["class"]

[tool.setuptools]
packages = ["plr_workshops"]

[tool.setuptools.package-data]
plr_workshops = ["*.py"]

[tool.setuptools.exclude-package-data]
"*" = []
