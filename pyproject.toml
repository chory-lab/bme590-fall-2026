[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bme590-workshops"
version = "0.1.0"
description = "Tooling for the BME 590 PyLabRobot workshops"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pylabrobot==0.2.2",
]

# The per-session entry point: `uv run bme590 start 01` and friends. Available
# because the installers install this project into .venv alongside its
# dependencies.
[project.scripts]
bme590 = "bme590.cli:main"

# The student desktop install. `uv sync` installs the project plus this group,
# so one command produces the environment the workshops run in. Kept as a
# dependency-group, not an extra, so it never lands in the browser wheel.
#
# Why these: ipykernel is what VS Code needs to run .ipynb against .venv;
# ipywidgets backs the visualizer's widget rendering; pandas/numpy/pillow are
# imported by the notebooks themselves; nbformat is what scripts/doctor.py reads
# them with. `[opentrons]` adds the Opentrons labware definitions workshop 04
# uses. Everything here is a pure-Python or prebuilt wheel on all three
# platforms — no compiler, no git, no conda.
#
# jupyterlab is deliberately NOT here. It is the largest single download in the
# tree (it roughly doubles a cold install) and VS Code's Jupyter extension is
# the documented editor, so it lives in its own group for students who want a
# browser editor and for CI, which executes the notebooks.
[dependency-groups]
class = [
  "pylabrobot[opentrons]==0.2.2",
  "ipykernel>=6.29",
  "ipywidgets>=8.1",
  "nbformat>=5.10",
  "pandas>=2.2",
  "numpy>=1.26",
  "pillow>=10.3",
]
notebook = [
  "jupyterlab>=4.2",
  "nbclient>=0.10",
]

# The test suite. Not installed by `uv sync` (it is not in default-groups), so
# a student environment never pays for it; CI and maintainers opt in with
# `uv sync --group dev`.
#
# playwright is here because half of what this module ships is browser code:
# the recorder script that maps websocket commands onto the page's recording
# globals, and the declutter script/CSS. Neither is reachable from Python, so
# the only honest way to test them is to run them in a real browser.
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "playwright>=1.44",
]

# Make `uv sync` (no flags) mean "the student environment". The installers rely
# on this: any extra flag a student has to type is a step that can go wrong.
[tool.uv]
default-groups = ["class"]

[tool.setuptools]
packages = ["bme590"]

[tool.setuptools.package-data]
bme590 = ["*.py"]

[tool.setuptools.exclude-package-data]
"*" = []

# Test configuration. asyncio_mode = "auto" means async test functions run
# without a per-test @pytest.mark.asyncio decorator.
#
# The session loop scopes are what let the `browser` fixture be session-scoped:
# a fixture and the tests using it must share an event loop, and launching
# Chromium once instead of once per test is the difference between a suite that
# runs in seconds and one that runs in minutes.
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
  "browser: needs a Playwright-driven Chromium (deselect with -m 'not browser')",
]
