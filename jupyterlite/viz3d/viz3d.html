<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyLabRobot 3D · Motion and Collisions</title>
<style>
  :root {
    --ui-font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --rule: #ddd;
    --gutter: 8px;
  }
  html, body { margin: 0; height: 100%; font-family: var(--ui-font); }
  #wrap { display: flex; height: 100vh; }
  #left, #right { height: 100%; min-width: 0; }
  #left { flex: 1 1 auto; }
  /* The viewer is the point of the demo: it gets the larger share by default. */
  #right { flex: 0 0 58%; border-left: 1px solid var(--rule); display: flex; flex-direction: column; }
  #status {
    display: none;
    position: fixed; left: 0; right: 0; top: 0; z-index: 9998;
    padding: 6px 14px; font-size: 13px;
    background: #eef3fb; color: #21324a; border-bottom: 1px solid #c9d8ee;
  }
  #status.error { background: #fdecea; color: #7a1c12; border-bottom-color: #f2c2bc; }
  body.has-status #status { display: block; }
  body.has-status #wrap { height: calc(100vh - 30px); margin-top: 30px; }
  iframe { width: 100%; height: 100%; border: 0; }
  #split {
    flex: 0 0 var(--gutter); cursor: col-resize; background: #f1f3f5;
    border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); position: relative;
  }
  #split::after {
    content: ""; position: absolute; top: 50%; left: 50%;
    width: 2px; height: 28px; margin: -14px 0 0 -1px; border-radius: 1px; background: #b9c0c8;
  }
  #split:hover, #split.dragging { background: #e3e7ea; }
  body.resizing iframe { pointer-events: none; }
  body.resizing { cursor: col-resize; user-select: none; }
  #dupe {
    display: none; position: fixed; inset: 0; z-index: 9999; background: #fff;
    align-items: center; justify-content: center; text-align: center; padding: 24px;
  }
  body.duplicate #dupe { display: flex; }
  body.duplicate #wrap { visibility: hidden; }
  #dupe > div { max-width: 30rem; }
  #dupe h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  #dupe p { color: #5b6472; line-height: 1.5; margin: 0 0 1.25rem; }
  #dupe button {
    font: inherit; font-weight: 600; padding: .5rem 1rem; border-radius: 6px;
    border: 1px solid #0d6efd; background: #0d6efd; color: #fff; cursor: pointer;
  }
  /* A phone has no room for two panes: the viewer on top, the notebook below. */
  @media (max-width: 760px) {
    #wrap { flex-direction: column; }
    #right { flex: 0 0 45%; border-left: 0; border-bottom: 1px solid var(--rule); order: -1; }
    #split { display: none; }
  }
</style>
</head>
<body>
<div id="dupe">
  <div>
    <h1>Already open in another tab</h1>
    <p>
      This page runs entirely in your browser, and two copies on the same site fight over the same
      storage, which shows up as a notebook that never gets a kernel. Switch to the other tab, or
      take over here.
    </p>
    <button id="dupe-takeover" type="button">Use this tab instead</button>
  </div>
</div>
<div id="status" role="status" aria-live="polite"></div>
<div id="wrap">
  <div id="left">
    <iframe id="lite" title="Notebook" src="./output/lab/index.html?path=viz3d/demo.ipynb"
            allow="clipboard-read; clipboard-write"></iframe>
  </div>
  <div id="split" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="Resize the viewer" title="Drag to resize"></div>
  <div id="right">
    <iframe id="viewer" title="PyLabRobot 3D viewer" src="./viz3d/viewer/index.html#token=hosted"></iframe>
  </div>
</div>
<script>
  // One tab per origin: JupyterLite's storage and service worker are shared with the workshops
  // page, which takes part in the same handshake under the same channel name.
  (function () {
    if (!("BroadcastChannel" in window)) return;
    const ch = new BroadcastChannel("plr-workshops-instance");
    const me = Math.random().toString(36).slice(2);
    let settled = false;
    function yieldTab() {
      settled = true;
      document.body.classList.add("duplicate");
      for (const f of document.querySelectorAll("iframe")) f.src = "about:blank";
    }
    ch.addEventListener("message", (e) => {
      const m = e.data || {};
      if (m.type === "hello" && m.from !== me && !document.body.classList.contains("duplicate")) {
        ch.postMessage({ type: "here", from: me });
      } else if (m.type === "here" && m.from !== me && !settled) {
        yieldTab();
      } else if (m.type === "takeover" && m.from !== me) {
        yieldTab();
      }
    });
    ch.postMessage({ type: "hello", from: me });
    setTimeout(() => { settled = true; }, 400);
    document.getElementById("dupe-takeover").addEventListener("click", () => {
      ch.postMessage({ type: "takeover", from: me });
      location.reload();
    });
  })();
</script>
<script>
  // Query parameters for drivers and presenters: ?nb=<path> opens another notebook, and
  // ?motion=<speed> is handed to the viewer (2 plays twice as fast, 0 skips the motion).
  (function () {
    const q = new URLSearchParams(location.search);
    const nb = q.get("nb");
    if (nb) document.getElementById("lite").src = "./output/lab/index.html?path=" + nb;
    const motion = q.get("motion");
    if (motion !== null) {
      document.getElementById("viewer").src =
        "./viz3d/viewer/index.html?motion=" + encodeURIComponent(motion) + "#token=hosted";
    }
  })();
</script>
<script>
  // The splitter: the viewer's width, remembered across reloads.
  (function () {
    const MIN_PANE = 260;
    const wrap = document.getElementById("wrap");
    const right = document.getElementById("right");
    const split = document.getElementById("split");
    const KEY = "plr.viz3dWidth";
    function setWidth(px) {
      const total = wrap.clientWidth - split.offsetWidth;
      const clamped = Math.max(MIN_PANE, Math.min(px, total - MIN_PANE));
      right.style.flexBasis = clamped + "px";
      return clamped;
    }
    let saved = NaN;
    try { saved = parseFloat(localStorage.getItem(KEY)); } catch (_) {}
    if (saved > 0) setWidth(saved);
    let dragging = false;
    split.addEventListener("pointerdown", (e) => {
      dragging = true;
      split.setPointerCapture(e.pointerId);
      split.classList.add("dragging");
      document.body.classList.add("resizing");
      e.preventDefault();
    });
    split.addEventListener("pointermove", (e) => {
      if (dragging) setWidth(wrap.getBoundingClientRect().right - e.clientX);
    });
    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      try { split.releasePointerCapture(e.pointerId); } catch (_) {}
      split.classList.remove("dragging");
      document.body.classList.remove("resizing");
      try { localStorage.setItem(KEY, right.offsetWidth); } catch (_) {}
    }
    split.addEventListener("pointerup", endDrag);
    split.addEventListener("pointercancel", endDrag);
    split.addEventListener("dblclick", () => {
      right.style.flexBasis = "58%";
      try { localStorage.removeItem(KEY); } catch (_) {}
    });
  })();
</script>
<script src="./bridge.js"></script>
<script>
  // The viewer and the notebook's kernel talk over a BroadcastChannel (viz3d/viz3d_shim.js and
  // viz3d_demo/bridge.py): nothing is relayed through this page. It only shows what the kernel's
  // setup says, which is otherwise silent, and counts what crosses the channel for drivers.
  (function () {
    const statusBar = document.getElementById("status");
    function setStatus(text, isError) {
      if (!text) { document.body.classList.remove("has-status"); return; }
      statusBar.textContent = text;
      statusBar.classList.toggle("error", !!isError);
      document.body.classList.add("has-status");
      if (isError) console.error("[viz3d]", text);
    }

    const counts = (window.__viz3dCounts = { down: {}, up: {}, viewers: 0 });
    if ("BroadcastChannel" in window) {
      new BroadcastChannel("plr-viz3d").onmessage = (e) => {
        try {
          const d = JSON.parse(e.data);
          if (d.viewer !== undefined) { counts.viewers += 1; return; }
          if (typeof d.message !== "string") return;
          const side = d.to !== undefined ? "down" : "up";
          const kind = JSON.parse(d.message).event || "?";
          counts[side][kind] = (counts[side][kind] || 0) + 1;
        } catch (_) {}
      };
    }

    // From the plr-workshops:bootstrap labextension, which installs the demo's PyLabRobot.
    window.addEventListener("message", (e) => {
      const d = e.data;
      if (!d || typeof d !== "object") return;
      if (d.type === "PLR_BOOTSTRAP_STARTED") {
        setStatus("Installing PyLabRobot in your browser (the first visit takes longer)…");
      }
      if (d.type === "PLR_BOOTSTRAP_READY") setStatus(null);
      if (d.type === "PLR_BOOTSTRAP_FAILED") {
        setStatus("The notebook's runtime failed to start: " + (d.error || "unknown error"), true);
      }
    });
  })();
</script>
</body>
</html>
